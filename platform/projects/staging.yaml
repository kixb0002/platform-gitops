apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ecommerce-staging
  namespace: argocd
spec:
  description: E-commerce staging; depot GitOps explicitement autorise
  sourceRepos:
  - https://github.com/kixb0002/platform-gitops.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: ecommerce-staging
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: Pod
  - group: ''
    kind: PersistentVolumeClaim
  - group: apps
    kind: Deployment
  - group: apps
    kind: ReplicaSet
  - group: apps
    kind: StatefulSet
  - group: batch
    kind: Job
  - group: batch
    kind: CronJob
  - group: autoscaling
    kind: HorizontalPodAutoscaler
  - group: policy
    kind: PodDisruptionBudget
  orphanedResources:
    warn: true
  roles:
  - name: reader
    description: Lecture des applications de cet environnement
    policies:
    - p, proj:ecommerce-staging:reader, applications, get, ecommerce-staging/*, allow
  - name: deployer
    description: Lecture et synchronisation manuelle sans modification des applications
    policies:
    - p, proj:ecommerce-staging:deployer, applications, get, ecommerce-staging/*,
      allow
    - p, proj:ecommerce-staging:deployer, applications, sync, ecommerce-staging/*,
      allow
