# Rôle : Expose seulement /api de Dev ; la destination est un Service ClusterIP, pas un pod nommé.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ecommerce-api-public
  namespace: ecommerce-dev
spec:
  parentRefs:
  - name: ecommerce-public
    namespace: platform-ingress
    sectionName: https
  hostnames:
  - api.lab-tk.click
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: ecommerce-api
      port: 80
