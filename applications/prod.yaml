# Rôle : Application Argo CD prod : relie le dépôt GitOps au namespace ; Dev automatique, promotions Staging/Prod manuelles.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-prod
  namespace: argocd
spec:
  project: ecommerce-prod
  source:
    repoURL: https://github.com/kixb0002/platform-gitops.git
    targetRevision: main
    path: apps/ecommerce/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-prod
  syncPolicy:
    syncOptions:
    - PruneLast=true
    - FailOnSharedResource=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
