# Rôle : Superpose les adaptations LAB au manifeste officiel figé, sans modifier le fournisseur.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../argocd
patches:
  - path: patch-0.yaml
  - path: patch-1.yaml
  - path: patch-2.yaml
  - path: patch-3.yaml
  - path: patch-server-network.yaml
