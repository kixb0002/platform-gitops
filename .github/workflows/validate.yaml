name: Validate platform
permissions:
  contents: read
jobs:
  gitops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
      with:
        version: v1.34.12
    - name: Install YAML parser
      run: python3 -m pip install PyYAML==6.0.3
    - name: Check Bash and rendered security boundaries
      run: "bash -n scripts/*.sh\nbash scripts/argocd.sh render\npython3 tests/check-sso.py\
        \ .local/argocd.yaml\nbash scripts/platform.sh render\nfor env in dev staging\
        \ prod; do\n  kubectl kustomize \"apps/ecommerce/overlays/$env\" > \".local/app-$env.yaml\"\
        \n  python3 tests/check-app.py \".local/app-$env.yaml\"\ndone\npython3 -m\
        \ py_compile scripts/render-sso.py tests/check-platform.py tests/integration-security.py\n"
    - name: Validate public HTTPS manifests and pinned chart
      run: 'kubectl kustomize platform/public-api > .local/public-api.yaml

        (cd bootstrap/cert-manager/vendor && sha256sum -c SHA256SUMS)

        '
'on':
  pull_request: null
  push:
    branches:
    - main
